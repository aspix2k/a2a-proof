name: Mutation tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.29"
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen mutmut run --max-children 1
      - run: uv run --frozen mutmut export-cicd-stats
      - name: Require a 95% mutation score
        run: |
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path

          stats = json.loads(Path("mutants/mutmut-cicd-stats.json").read_text())
          score = stats["killed"] / stats["total"]
          print(f"mutation score: {score:.1%}")
          invalid = ("no_tests", "suspicious", "timeout", "segfault")
          raise SystemExit(score < 0.95 or any(stats[key] for key in invalid))
          PY
