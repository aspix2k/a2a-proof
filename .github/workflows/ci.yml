name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.29"
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ty check
      - run: uv run --frozen python scripts/generate_schema.py --check
      - run: uv run --frozen zizmor --persona=pedantic --offline --strict-collection .
      - run: uv run --frozen pytest --cov=a2a_proof --cov-report=term-missing
      - name: Validate examples
        run: |
          for config in examples/*.yaml; do
            uv run --frozen a2a-proof check "$config"
          done
      - run: uv build
      - run: uv run --frozen twine check dist/*
      - run: uvx --from dist/*.whl a2a-proof --help

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.11.29"
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen pytest

  platforms:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.11.29"
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen pytest

  ap2:
    name: AP2 v0.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.29"
      - run: >-
          uv run --isolated --default-index https://pypi.org/simple --with-editable .
          --with 'ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@b4587ac1d055888a73b4b21750973cffba961793'
          pytest -q tests/test_ap2_official.py

  action:
    name: First-party Action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.29"
      - name: Start demo agent
        run: |
          ready_file="$RUNNER_TEMP/a2a-proof-demo-url"
          uv run --isolated --frozen --no-dev python tests/action/server.py "$ready_file" &
          echo "$!" > "$RUNNER_TEMP/a2a-proof-demo.pid"
          for _ in {1..300}; do
            if test -s "$ready_file"; then
              demo_url=$(cat "$ready_file")
            else
              sleep 0.1
              continue
            fi
            if curl --fail --silent "$demo_url/.well-known/agent-card.json" >/dev/null; then
              echo "A2A_PROOF_DEMO_URL=$demo_url" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.1
          done
          exit 1
      - name: Run local Action
        uses: ./
        with:
          config: tests/action/a2a-proof.yaml
      - name: Stop demo agent
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/a2a-proof-demo.pid"; then
            kill "$(cat "$RUNNER_TEMP/a2a-proof-demo.pid")" 2>/dev/null || true
          fi
